services:
  tsyp-simulation:
    build:
      context: .
      dockerfile: Dockerfile
    image: tsyp-simulation:jazzy
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      GZ_IP: 127.0.0.1
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      TERM: xterm-256color
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
